<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>The Enchanted Christmas Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="vignette" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<div id="charge" aria-hidden="true"><span></span></div>

<section id="timeline" aria-hidden="true" aria-label="September to Christmas Day">
  <header id="tl-head">
    <p id="tl-kicker"></p>
    <h2 id="tl-title"></h2>
  </header>
  <button id="tl-close" aria-label="Close the timeline">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="tl-scroll" tabindex="0">
    <div id="tl-rail"></div>
    <div id="tl-track"></div>
  </div>
  <p id="tl-hint"></p>
</section>

<div id="loader">
  <div class="loader-inner">
    <div class="loader-star" aria-hidden="true"></div>
    <p class="loader-title">The Enchanted Christmas Tree</p>
    <p class="loader-sub" id="loader-sub">trimming the branches&hellip;</p>
  </div>
</div>

<header id="titlebar">
  <h1>The Enchanted <em>Christmas</em> Tree</h1>
  <p id="mode-label">Enchanted mode &middot; drag to turn the tree</p>
</header>

<div id="tooltip" role="status" aria-live="polite"></div>

<div id="hint">Click the ornaments, the gifts and the star.<br />Twelve coloured stars are out in the sky — one for each record.<br />Press and hold the tree.</div>

<nav id="controls" aria-label="Tree controls">
  <button id="btn-mode" class="ctl ctl-wide" aria-pressed="false">
    <span class="ctl-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 10l-4.4 3.2L17 19l-5-3-5 3 1.4-5.8L4 10l5.8-1.4z"/></svg>
    </span>
    <span class="ctl-txt" id="btn-mode-txt">Cosmic mode</span>
  </button>
  <button id="btn-spin" class="ctl" title="Automatic rotation" aria-pressed="true" aria-label="Toggle automatic rotation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>
  </button>
  <button id="btn-reset" class="ctl" title="Reset the camera" aria-label="Reset the camera">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M4 9V5h4"/><path d="M20 15v4h-4"/><path d="M4.5 9.5A8 8 0 0 1 19 9"/><path d="M19.5 14.5A8 8 0 0 1 5 15"/></svg>
  </button>
  <button id="btn-lights" class="ctl" title="Turn the special effects off" aria-pressed="true" aria-label="Toggle special effects">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
  </button>
  <button id="btn-help" class="ctl" title="About" aria-label="About">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.2c-.8.5-1.2 1-1.2 1.9"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
  </button>
</nav>

<div id="card" role="dialog" aria-modal="false" aria-labelledby="card-title">
  <button id="card-close" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="card-media"></div>
  <p id="card-kicker"></p>
  <h2 id="card-title"></h2>
  <p id="card-body"></p>
  <p id="card-foot"></p>
</div>

<script type="module" src="./src/main.js"></script>
<noscript><p style="color:#dce5ef;font:16px system-ui;padding:2rem">This Christmas tree needs JavaScript and WebGL.</p></noscript>
</body>
</html>
